name: Fonctionnalité
description: Nouvelle fonctionnalité ou tâche
labels: ['type:feat']
body:
  - type: textarea
    id: goal
    attributes:
      label: Objectif
      description: Ce que l'utilisateur peut faire une fois terminé.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Périmètre
      description: Ce qui est inclus / exclu. Références (HANDOFF §, fiche composant…).
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      value: |
        - [ ]
    validations:
      required: true
