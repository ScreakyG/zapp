name: Bug
description: Quelque chose ne marche pas
labels: ["type:bug"]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Plateforme
      options: [TV webOS, PC Electron, Navigateur (dev)]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Attendu / obtenu
    validations:
      required: true
